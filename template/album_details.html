{% extends 'base.html' %}

{% block title %}{{ album.album_name }}{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto animate-fade-in-up">
    <div class="card overflow-hidden">
        <div class="relative">
            {% if album.album_photo %}
            <img src="{{ album.album_photo.url }}" class="w-full h-72 md:h-96 object-cover" alt="{{ album.album_name }}">
            {% else %}
            <div class="w-full h-72 md:h-96 bg-gradient-to-br from-slate-100 to-slate-200 flex items-center justify-center">
                <svg class="w-16 h-16 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                </svg>
            </div>
            {% endif %}
        </div>
        <div class="p-8">
            <h2 class="text-3xl md:text-4xl font-extrabold text-navy mb-4 bg-gradient-to-r from-navy via-primary to-secondary bg-clip-text text-transparent">{{ album.album_name }}</h2>
            <p class="text-slate-600 mb-8 leading-relaxed text-lg">{{ album.album_description }}</p>
            <div class="flex justify-between items-center pt-6 border-t border-slate-100">
                <a href="{% url 'albums' %}" class="btn-secondary">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
                    </svg>
                    Back to Albums
                </a>
                <small class="text-slate-400">{{ album.date_created|date:"M d, Y" }}</small>
            </div>
        </div>
    </div>
</div>
{% endblock %}

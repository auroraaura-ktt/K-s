{% extends 'customadmin/base.html' %}

{% block title %}{{ action }} Project{% endblock %}

{% block content %}
<div style="max-width: 42rem; margin: 0 auto;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
        <h1 style="font-size: 1.5rem; font-weight: 700; color: var(--color-text);">{{ action }} Project</h1>
        <a href="{% url 'customadmin:project_list' %}" class="btn-secondary">Back</a>
    </div>

    <div class="card" style="padding: 1.5rem;">
        <form method="post" enctype="multipart/form-data" style="display: flex; flex-direction: column; gap: 1rem;">
            {% csrf_token %}
            <div>
                <label style="display: block; font-size: 0.875rem; font-weight: 500; color: var(--color-text); margin-bottom: 0.25rem;">Title</label>
                {{ form.title }}
            </div>
            <div>
                <label style="display: block; font-size: 0.875rem; font-weight: 500; color: var(--color-text); margin-bottom: 0.25rem;">Description</label>
                {{ form.description }}
            </div>
            <div>
                <label style="display: block; font-size: 0.875rem; font-weight: 500; color: var(--color-text); margin-bottom: 0.25rem;">Photo</label>
                {{ form.photo }}
            </div>
            <div>
                <label style="display: block; font-size: 0.875rem; font-weight: 500; color: var(--color-text); margin-bottom: 0.25rem;">Live Demo URL</label>
                {{ form.url }}
            </div>
            <div>
                <label style="display: block; font-size: 0.875rem; font-weight: 500; color: var(--color-text); margin-bottom: 0.25rem;">GitHub URL</label>
                {{ form.github_url }}
            </div>
            <div style="display: flex; align-items: center;">
                {{ form.is_featured }}
                <label style="margin-left: 0.5rem; font-size: 0.875rem; font-weight: 500; color: var(--color-text);">Featured Project</label>
            </div>
            <button type="submit" class="btn-primary" style="width: 100%;">Save</button>
        </form>
    </div>
</div>
{% endblock %}

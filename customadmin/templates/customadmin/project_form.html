{% extends 'customadmin/base.html' %}

{% block title %}{{ action }} Project{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold text-gray-900">{{ action }} Project</h1>
        <a href="{% url 'customadmin:project_list' %}" class="btn-secondary">Back</a>
    </div>

    <div class="card p-6">
        <form method="post" enctype="multipart/form-data" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Title</label>
                {{ form.title }}
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
                {{ form.description }}
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Photo</label>
                {{ form.photo }}
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Live Demo URL</label>
                {{ form.url }}
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">GitHub URL</label>
                {{ form.github_url }}
            </div>
            <div class="flex items-center">
                {{ form.is_featured }}
                <label class="ml-2 text-sm font-medium text-gray-700">Featured Project</label>
            </div>
            <button type="submit" class="btn-primary w-full">Save</button>
        </form>
    </div>
</div>
{% endblock %}

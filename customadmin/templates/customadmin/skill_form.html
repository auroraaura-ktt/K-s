{% extends 'customadmin/base.html' %}

{% block title %}{{ action }} Skill{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold text-gray-900">{{ action }} Skill</h1>
        <a href="{% url 'customadmin:skill_list' %}" class="btn-secondary">Back</a>
    </div>

    <div class="card p-6">
        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Name</label>
                {{ form.name }}
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Proficiency (0-100)</label>
                {{ form.proficiency }}
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Icon (emoji or class)</label>
                {{ form.icon }}
            </div>
            <div class="flex items-center">
                {{ form.is_featured }}
                <label class="ml-2 text-sm font-medium text-gray-700">Featured</label>
            </div>
            <button type="submit" class="btn-primary w-full">Save</button>
        </form>
    </div>
</div>
{% endblock %}

{% extends 'customadmin/base.html' %}

{% block title %}{{ action }} Skill{% endblock %}

{% block content %}
<div style="max-width: 28rem; margin: 0 auto;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
        <h1 style="font-size: 1.5rem; font-weight: 700; color: var(--color-text);">{{ action }} Skill</h1>
        <a href="{% url 'customadmin:skill_list' %}" class="btn-secondary">Back</a>
    </div>

    <div class="card" style="padding: 1.5rem;">
        <form method="post" style="display: flex; flex-direction: column; gap: 1rem;">
            {% csrf_token %}
            <div>
                <label style="display: block; font-size: 0.875rem; font-weight: 500; color: var(--color-text); margin-bottom: 0.25rem;">Name</label>
                {{ form.name }}
            </div>
            <div>
                <label style="display: block; font-size: 0.875rem; font-weight: 500; color: var(--color-text); margin-bottom: 0.25rem;">Proficiency (0-100)</label>
                {{ form.proficiency }}
            </div>
            <div>
                <label style="display: block; font-size: 0.875rem; font-weight: 500; color: var(--color-text); margin-bottom: 0.25rem;">Icon (emoji or class)</label>
                {{ form.icon }}
            </div>
            <div style="display: flex; align-items: center;">
                {{ form.is_featured }}
                <label style="margin-left: 0.5rem; font-size: 0.875rem; font-weight: 500; color: var(--color-text);">Featured</label>
            </div>
            <button type="submit" class="btn-primary" style="width: 100%;">Save</button>
        </form>
    </div>
</div>
{% endblock %}

{% extends 'customadmin/base.html' %}

{% block title %}Confirm Delete{% endblock %}

{% block content %}
<div style="max-width: 28rem; margin: 0 auto;">
    <div class="card" style="padding: 2rem; text-align: center;">
        <h2 style="font-size: 1.5rem; font-weight: 700; color: var(--color-text); margin-bottom: 1rem;">Confirm Delete</h2>
        <p style="color: #4b5563; margin-bottom: 1.5rem;">
            Are you sure you want to delete this {{ model_name }}?
        </p>
        <p style="color: var(--color-text); font-weight: 500; margin-bottom: 1.5rem;">{{ object }}</p>
        <form method="post" style="display: flex; justify-content: center; gap: 1rem;">
            {% csrf_token %}
            <a href="javascript:history.back()" class="btn-secondary">Cancel</a>
            <button type="submit" style="background-color: #dc2626; color: var(--color-white); font-weight: 500; padding: 0.5rem 1rem; border-radius: 0.5rem; border: none; cursor: pointer; transition: background-color 0.3s ease;">Delete</button>
        </form>
    </div>
</div>
{% endblock %}

{% extends 'customadmin/base.html' %}

{% block title %}Confirm Delete{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
    <div class="card p-8 text-center">
        <h2 class="text-2xl font-bold text-gray-900 mb-4">Confirm Delete</h2>
        <p class="text-gray-600 mb-6">
            Are you sure you want to delete this {{ model_name }}?
        </p>
        <p class="text-gray-900 font-medium mb-6">{{ object }}</p>
        <form method="post" class="flex justify-center space-x-4">
            {% csrf_token %}
            <a href="javascript:history.back()" class="btn-secondary">Cancel</a>
            <button type="submit" class="bg-red-600 hover:bg-red-700 text-white font-medium py-2 px-4 rounded-lg transition-colors">Delete</button>
        </form>
    </div>
</div>
{% endblock %}
